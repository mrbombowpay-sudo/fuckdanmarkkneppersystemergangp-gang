<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kørekort – designstudie</title>
<style>
:root{
  --bg:#061528;
  --bg-2:#0b1f3a;
  --ink:#1a1450;
  --ink-soft:#5a4a8a;
  --white:#f4f6fb;
  --muted:#8b95ab;
}

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:#020a15;
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  touch-action:none;
}

.phone{
  width:100%;height:100%;
  max-width:420px;max-height:880px;
  background:var(--bg);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  touch-action:none;
}
@media (min-width:480px) and (min-height:700px){
  .phone{
    border-radius:38px;
    height:min(880px,96vh);
    border:1px solid #1a2f4d;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
}

header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;
}
header h1{
  font-size:17px;font-weight:600;letter-spacing:.13em;
  display:flex;align-items:center;gap:9px;
}
.logo{width:30px;height:22px;display:grid;place-items:center;background:transparent;}
.logo img{width:28px;height:20px;display:block;object-fit:contain;}
.dots{
  background:none;border:0;color:#fff;
  font-size:24px;letter-spacing:2px;cursor:pointer;
  line-height:1;padding:4px 4px;
}

main{flex:1;overflow:hidden;padding:4px 14px 14px;position:relative}
.view{display:none}
.view.on{display:block}

/* ========== KORT ========== */
.scene{perspective:1200px}

.card{
  --rx:0deg;--ry:0deg;--gx:50%;--gy:28%;
  position:relative;
  border-radius:16px;
  min-height:620px;
  padding:20px 18px 16px;
  color:var(--ink);
  cursor:pointer;
  background:
    radial-gradient(circle at var(--gx) var(--gy), rgba(255,255,255,.55), transparent 40%),
    radial-gradient(ellipse at 75% 15%, rgba(230,170,240,.35), transparent 50%),
    linear-gradient(168deg, #f9c6da 0%, #f5d4e9 35%, #efc8f0 65%, #f7cce4 100%);
  transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .22s ease-out;
  box-shadow:0 16px 36px rgba(0,0,0,.32);
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* Soft horizontal wave pattern like the real card */
.card::before{
  content:"";
  position:absolute;inset:0;
  opacity:.32;
  pointer-events:none;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent 0 10px,
      rgba(170,90,190,.13) 10px 11px
    );
  background-size:100% 22px;
}

.card > *{position:relative;z-index:2}

.top{
  display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
}
.issuer{
  font-size:13.5px;line-height:1.38;font-weight:400;color:#3d2a6e;
}

.portrait{
  width:132px;height:160px;
  border-radius:9px;
  border:2.5px solid #fff;
  flex:none;
  background:linear-gradient(180deg,#e4e6f0,#b0b5c8);
  overflow:hidden;
  position:relative;
  box-shadow:0 3px 12px rgba(40,30,90,.2);
  z-index:3;
}
.portrait svg,.portrait img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}

.name{
  margin-top:26px;
  font-size:32px;line-height:1.2;font-weight:650;
  max-width:200px;color:#1a1450;letter-spacing:-.015em;
}

.facts{
  margin-top:auto;
  display:grid;
  grid-template-columns:1.15fr .7fr 1.2fr;
  gap:6px;
  padding-top:6px;
}
.facts dt{
  font-size:11px;font-weight:600;letter-spacing:.04em;
  color:#5c4a8c;text-transform:uppercase;
}
.facts dd{
  font-size:19px;font-weight:650;margin-top:2px;color:#1a1450;
}

.chip{
  align-self:center;
  margin:32px 0 18px;
  display:inline-flex;gap:8px;align-items:center;
  border:1.5px solid #2a1a5e;
  border-radius:8px;
  padding:6px 14px;
  font-weight:650;font-size:17px;
  color:#1a1450;
  background:rgba(255,255,255,.22);
}

/* DK seal */
.stamp{
  position:absolute;
  right:98px;
  top:52px;
  width:142px;height:142px;
  opacity:.48;
  pointer-events:none;
  transform:rotate(-6deg);
  z-index:1;
}

.updated{
  text-align:center;font-size:13px;color:#3d2a6e;
}
.updated b{font-weight:600}

.notice{
  margin-top:12px;text-align:center;
  font-size:11.5px;color:var(--muted);line-height:1.45;padding:0 8px;
}

/* INFO + SETTINGS */
.panel{background:var(--bg-2);border-radius:14px;padding:6px 16px;margin-bottom:12px}
.row{
  display:flex;justify-content:space-between;gap:14px;
  padding:14px 0;border-bottom:1px solid #1a3050;font-size:14.5px;
}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right;font-weight:500}

h2{font-size:20px;font-weight:600;margin:8px 4px 12px}
.hint{font-size:12.5px;color:var(--muted);margin:0 4px 14px;line-height:1.45}

.switch{
  width:44px;height:26px;border-radius:99px;
  background:#27405f;border:0;position:relative;cursor:pointer;flex:none;
  transition:background .2s;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;background:#fff;
  transition:transform .2s;
}
.switch[aria-checked="true"]{background:#c9a0e8}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.opt{align-items:center}
.opt span:first-child{color:#fff}
.opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.edit{display:grid;gap:9px;margin-bottom:12px}
.edit label{font-size:12.5px;color:var(--muted)}
.edit input{
  width:100%;margin-top:5px;
  background:var(--bg-2);border:1px solid #1a3050;
  border-radius:10px;color:#fff;padding:11px 13px;font:inherit;
}
.photo-upload input[type="file"]{cursor:pointer;padding:8px}
.photo-preview{
  width:84px;height:102px;margin-top:7px;
  border-radius:7px;overflow:hidden;
  border:1px solid #1a3050;background:#071a30;display:none;
}
.photo-preview img{width:100%;height:100%;object-fit:cover}

/* NAV */
nav{
  display:flex;justify-content:space-around;
  padding:9px 6px 13px;
  border-top:1px solid #12294a;background:var(--bg);
}
nav button{
  background:none;border:0;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font:inherit;font-size:12.5px;cursor:pointer;
  padding:5px 8px;border-radius:11px;
}
nav button svg{width:28px;height:28px}
nav button[aria-selected="true"]{color:#fff}
nav button[aria-selected="true"] .ico{background:#fff;color:var(--bg)}
.ico{width:42px;height:32px;border-radius:8px;display:grid;place-items:center}

button:focus-visible,input:focus-visible,.card:focus-visible{
  outline:2.5px solid #c9a0e8;outline-offset:2px;
}
@media (prefers-reduced-motion:reduce){
  .card,.switch,.switch::after{transition:none}
}
</style>
</head>

<main>
<section class="view on" id="v-card" aria-label="Kort">
  <div class="scene">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Åbn kortinfo">

      <!-- Realistic DK seal -->
      <svg class="stamp" viewBox="0 0 160 160" aria-hidden="true">
        <defs>
          <path id="textCircle" d="M80,80 m-54,0 a54,54 0 1,1 108,0 a54,54 0 1,1 -108,0"/>
        </defs>
        <circle cx="80" cy="80" r="70" fill="none" stroke="#8b6bc9" stroke-width="1.3" opacity=".55"/>
        <circle cx="80" cy="80" r="63" fill="none" stroke="#c48bb8" stroke-width="1" opacity=".48"/>
        <circle cx="80" cy="80" r="55" fill="none" stroke="#8b6bc9" stroke-width=".85" opacity=".4"/>
        <circle cx="80" cy="80" r="46" fill="none" stroke="#9a7ad0" stroke-width=".75" stroke-dasharray="2.2 2.2" opacity=".42"/>
        <text fill="#7a5fc0" font-size="9.2" font-weight="600" letter-spacing="2" opacity=".72">
          <textPath href="#textCircle" startOffset="1%">DANMARK • DANMARK • DANMARK • DANMARK •</textPath>
        </text>
        <text x="80" y="91" text-anchor="middle" font-size="34" font-weight="700" fill="#7a5fc0" opacity=".78">DK</text>
      </svg>

        <p class="issuer">

            <path d="M20 170c4-40 26-55 50-55s46 15 50 55z" fill="#f0f2f8" opacity=".9"/>
          </svg>
        </div>

    Scan

    Kontrol
  </button>
</nav>

<script>
const $ = s => document.querySelector(s);
const months = ["jan.","feb.","mar.","apr.","maj","jun.","jul.","aug.","sep.","okt.","nov.","dec."];
const catNames = {LK:"let knallert",AM:"lille knallert",B:"personbil"};
let tilt = true;

function render(){
  const name = $("#inName").value.trim() || "Alex Eksempel Madsen";
  $("#nameOut").innerHTML = name.split(/\\s+/).map(w => w.replace(/</g,"&lt;")).join("<br>");
  const d = new Date($("#inDob").value);
  if(!isNaN(d)){
    const p = n => String(n).padStart(2,"0");
    $("#dobOut").textContent = `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
    const now = new Date();
    let age = now.getFullYear() - d.getFullYear();
    if(now < new Date(now.getFullYear(), d.getMonth(), d.getDate())) age--;
    $("#ageOut").textContent = age + " år";
  }
  const cat = ($("#inCat").value.trim() || "LK").toUpperCase();
  $("#catOut").textContent = cat;
  $("#i-cat").textContent = catNames[cat] ? `${cat} – ${catNames[cat]}` : cat;
  $("#numOut").textContent = $("#inNum").value.trim() || "00000000";
}

function stamp(){
  const n = new Date();
  const dateStr = `${n.getDate()}. ${months[n.getMonth()]} ${n.getFullYear()}`;
  $("#issued").textContent = dateStr;
  $("#i-iss").textContent = dateStr;
  $("#updOut").textContent = `${dateStr} kl. ${String(n.getHours()).padStart(2,"0")}.${String(n.getMinutes()).padStart(2,"0")}`;
}

["inName","inDob","inCat","inNum"].forEach(id => $("#"+id).addEventListener("input", render));

function show(v){
  document.querySelectorAll(".view").forEach(e => e.classList.toggle("on", e.id === "v-"+v));
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
  $("main").scrollTop = 0;
}

document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    if(b.dataset.v === "scan" || b.dataset.v === "control") show("card");
    else show(b.dataset.v);
  });
});

$("#menuBtn").addEventListener("click", () => show("set"));

$("#tiltSw").addEventListener("click", e => {
  tilt = e.currentTarget.getAttribute("aria-checked") !== "true";
  e.currentTarget.setAttribute("aria-checked", tilt);
  if(!tilt) reset();
});

const card = $("#card");
function reset(){
  card.style.setProperty("--rx","0deg");
  card.style.setProperty("--ry","0deg");
  card.style.setProperty("--gx","50%");
  card.style.setProperty("--gy","28%");
}
function move(x,y){
  if(!tilt || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const r = card.getBoundingClientRect();
  const px = (x-r.left)/r.width;
  const py = (y-r.top)/r.height;
  card.style.setProperty("--ry", ((px-.5)*9)+"deg");
  card.style.setProperty("--rx", ((.5-py)*7)+"deg");
  card.style.setProperty("--gx", (px*100)+"%");
  card.style.setProperty("--gy", (py*100)+"%");
}
card.addEventListener("pointermove", e => move(e.clientX, e.clientY));
card.addEventListener("pointerleave", reset);
card.addEventListener("click", () => show("info"));
card.addEventListener("keydown", e => {
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); show("info"); }
});

$("#inPhoto").addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const image = ev.target.result;
    const def = $("#defaultPortrait");
    if(def) def.style.display = "none";
    const old = $("#portrait img");
    if(old) old.remove();
    const img = document.createElement("img");
    img.src = image; img.alt = "Valgt billede";
    $("#portrait").appendChild(img);
    $("#photoPreview").style.display = "block";
    $("#photoPreviewImg").src = image;
  };
  reader.readAsDataURL(file);
});

// Random kørekortnummer hver gang siden åbnes
function randomKortNr(){
  let n = "";
  for(let i=0;i<8;i++) n += Math.floor(Math.random()*10);
  return n;
}

const randomNum = randomKortNr();
$("#numOut").textContent = randomNum;
$("#inNum").value = randomNum;

render();
stamp();
</script>
